<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Coelus</title>
<style>
:root{--lf:invert(1);--pf:none;--bg:#f4f5f8;--fg:#17171c;--card:#fff;--bd:#d9dbe3;--ac:#3b6bff;--dk:#101014;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--lf:none;--pf:invert(1);--bg:#14141a;--fg:#f0f0f5;--card:#212129;--bd:#34343f}}
:root[data-theme=dark]{--lf:none;--pf:invert(1);--bg:#14141a;--fg:#f0f0f5;--card:#212129;--bd:#34343f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px;min-height:100vh}
.logo{font-weight:900;letter-spacing:.12em;font-size:40px}.logo i{display:inline-block;width:.62em;height:.62em;border:.16em solid currentColor;border-radius:50%;margin:0 .04em;vertical-align:-.02em;box-shadow:.2em -.12em 0 -.1em currentColor}
.full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:5}
.w{background:#f8f8f8;color:#111}.d{background:radial-gradient(circle at 30% 20%,#2a3a8f,#0d0d14 70%);color:#fff}
.b{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:16px;font-weight:600;cursor:pointer}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff}.b.s{width:auto;display:inline-block;padding:7px 11px;font-size:13px}.b.r{background:#c0392b;color:#fff;border-color:#c0392b}.d .b{max-width:340px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:16px;margin:4px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.strip>div{font-size:13px}.fr{text-align:center;min-width:70px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--bd);font-size:13px;cursor:pointer}.g>img,.g>.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#6a5acd;display:block}.g div{padding:6px 8px}
.ck{width:1.05em;height:1.05em;vertical-align:-.15em;margin-left:3px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:3}
nav button{flex:1;max-width:100px;border:0;background:none;color:var(--fg);font-size:13px;padding:8px 2px;border-radius:8px;cursor:pointer}nav .on{background:var(--bd);font-weight:700}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.m{opacity:.65;font-size:13px}#t{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;display:none;max-width:90%}
.scene{position:relative;border-radius:16px;display:flex;justify-content:center;padding:14px 0;margin:10px 0}.pill{position:absolute;top:10px;right:10px;background:#0b0b14;color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center}.pill svg{width:22px;height:22px;vertical-align:0}.pv{aspect-ratio:1;background:#2c2c36;display:flex;align-items:center;justify-content:center;overflow:hidden}.pv svg{height:100%;width:100%}.strip .g{min-width:140px;max-width:140px}.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tabs .b{width:auto;padding:7px 12px;font-size:14px}
.belt{position:relative;height:112px;overflow:hidden;border-radius:12px;background:linear-gradient(#7ad66e 0 12%,#c0392b 12% 88%,#7ad66e 88%);border:2px solid var(--bd);margin:8px 0}.bc{position:absolute;top:6px;left:0;width:66px;text-align:center;font-size:10px;line-height:1.1;color:#fff;font-weight:700;cursor:pointer;text-shadow:0 1px 2px #000}.bc svg{display:block;margin:0 auto}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg .card{margin:0;padding:8px;text-align:center;font-size:12px;min-height:130px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-right:5px}
.chip{display:inline-block;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:800;color:#fff;margin-right:4px;vertical-align:1px}
.vipn{background:linear-gradient(90deg,#ffd23b,#ff7a18,#ff3d7a);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
body.land nav{display:none}
@media (orientation:portrait){body.land #app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;max-width:none;margin:0;transform-origin:0 0;transform:rotate(90deg);overflow:auto;min-height:0;padding:8px 14px 20px}body.land #w2{width:auto;height:calc(100vw - 210px)}body.land #bbc{width:auto;height:calc(100vw - 16px);max-width:100%}}
@media (orientation:landscape){body.land #app{max-width:none}body.land #w2{width:auto;height:calc(100vh - 210px)}body.land #bbc{width:auto;height:calc(100vh - 16px);max-width:100%}}
#rtroot{display:none;position:fixed;z-index:200;background:#0b0b10;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
@media (orientation:landscape){#rtroot{top:0;left:0;right:0;bottom:0}}
@media (orientation:portrait){#rtroot{top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}}
#rtroot canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#rtui{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
#rtui .pa{pointer-events:auto}
.rbt{background:#14151cdd;color:#fff;border:0;padding:10px 20px;font-weight:800;font-size:15px;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);cursor:pointer;margin:3px}
.rbt.p{background:#e2336b}.rbt.g{background:#2a9d5c}.rbt.r{background:#b32424}.rbt.on{background:#fff;color:#111}
.rpn{background:#0b0b10e6;border:1px solid #ffffff22;border-radius:12px;padding:12px}
.rchip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-right:4px}
.rn{position:absolute;width:76px;height:76px;border-radius:50%;background:#b32424;border:5px solid #2f8bff;color:#fff;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.rs{position:absolute;width:84px;height:84px;color:#fff;font-size:70px;line-height:76px;text-align:center;border:4px solid #fff;border-radius:12px;pointer-events:auto;font-weight:300}
#rtui input,#rtui select{width:auto;background:#1b1c26;color:#fff;border:1px solid #ffffff33;padding:8px;margin:3px;border-radius:8px;font-size:14px}
body.rt{overflow:hidden}body.rt #app{display:none}body.rt nav{display:none}
.logo img{height:1.05em;vertical-align:-.15em;margin-right:.03em;filter:var(--lf)}.d .logo img{filter:none}.full.d>*:not(.bnl){position:relative;z-index:1}.pli{filter:var(--pf)}
.pf{width:120px;height:120px;border-radius:26px;box-shadow:0 4px 20px #0008;object-fit:cover}

onSnapshot:function(f){(subs[c]=subs[c]||[]).push(f);setTimeout(function(){f(snap(c))},0);return function(){}}}}};
